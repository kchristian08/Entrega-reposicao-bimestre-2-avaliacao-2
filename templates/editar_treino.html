{% extends "base.html" %}

{% block title %}Editar Treino{% endblock %}

{% block content %}
<h2>Editar treino</h2>

<form method="post">
    <label for="titulo">Título</label>
    <input id="titulo" name="titulo" value="{{ treino['titulo'] }}" required>

    <label for="tipo">Tipo</label>
    <select id="tipo" name="tipo" required>
        {% for tipo in ["Cardio", "Musculação", "Mobilidade", "Funcional"] %}
            <option value="{{ tipo }}" {% if treino['tipo'] == tipo %}selected{% endif %}>{{ tipo }}</option>
        {% endfor %}
    </select>

    <label for="duracao">Duração em minutos</label>
    <input id="duracao" name="duracao" type="number" min="1" value="{{ treino['duracao'] }}" required>

    <p><button type="submit">Atualizar</button></p>
</form>
{% endblock %}
